<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 96" role="img" aria-label="Côte d'Ivoire Terminal">
  <defs>
    <linearGradient id="goldLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#d4a017" stop-opacity="0"/>
      <stop offset="50%" stop-color="#d4a017" stop-opacity="1"/>
      <stop offset="100%" stop-color="#d4a017" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="cyanGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
  </defs>

  <!-- Anchor/container icon -->
  <g transform="translate(8, 18)">
    <circle cx="28" cy="28" r="26" fill="none" stroke="url(#cyanGlow)" stroke-width="2"/>
    <!-- Container shape -->
    <rect x="14" y="22" width="28" height="14" fill="none" stroke="#ffffff" stroke-width="1.6" rx="1"/>
    <line x1="21" y1="22" x2="21" y2="36" stroke="#ffffff" stroke-width="1"/>
    <line x1="28" y1="22" x2="28" y2="36" stroke="#ffffff" stroke-width="1"/>
    <line x1="35" y1="22" x2="35" y2="36" stroke="#ffffff" stroke-width="1"/>
    <!-- Wave under container -->
    <path d="M 8 44 Q 18 40, 28 44 T 48 44" fill="none" stroke="#22d3ee" stroke-width="1.6" stroke-linecap="round"/>
    <path d="M 8 48 Q 18 44, 28 48 T 48 48" fill="none" stroke="#22d3ee" stroke-width="1.2" stroke-linecap="round" opacity="0.6"/>
  </g>

  <!-- Wordmark -->
  <g font-family="Inter, Segoe UI, sans-serif" fill="#ffffff">
    <text x="78" y="40" font-size="18" font-weight="700" letter-spacing="2">CÔTE D'IVOIRE</text>
    <text x="78" y="62" font-size="13" font-weight="500" letter-spacing="6" fill="#cbd5e1">TERMINAL</text>
    <rect x="78" y="70" width="200" height="2" fill="url(#goldLine)"/>
    <text x="78" y="86" font-size="8" font-weight="500" letter-spacing="2" fill="#94a3b8">TREICHVILLE · PC6 · ABIDJAN</text>
  </g>
</svg>
